name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The probe boots the real build from `lib/`, so the build has to exist first.
      - run: pnpm run build
      # Per-release installs are reused between runs. The script installs a version only when its
      # directory is missing or the release's own cordis pin changed (it records that pin beside the
      # install), so a release published since the cache was written is installed here and probed like
      # the rest rather than being skipped.
      - uses: actions/cache@v4
        with:
          path: .compat
          key: compat-${{ runner.os }}-${{ hashFiles('scripts/dsh-compat.mjs', 'package.json') }}
          restore-keys: compat-${{ runner.os }}-
      # Every published release inside the declared peer range must mount this build. This is a GATE,
      # not a report: a release that renames a seat, an icon or a contract breaks the plugin for the
      # users who run that release, and nothing else in CI would notice. The report-only probe of
      # releases NEWER than the one we ship is a separate workflow (compat-newer.yml).
      - run: pnpm run compat
